<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Smart AI - আপনার বন্ধু</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 24px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.6rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .chat-header p {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.9);
            margin-top: 5px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            justify-content: flex-end;
        }

        .ai-message {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 22px;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 0.95rem;
        }

        .user-message .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .ai-message .message-content {
            background: white;
            color: #1a1a2e;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .chat-input {
            display: flex;
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
            gap: 12px;
        }

        .chat-input input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e5e7eb;
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }

        .chat-input input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .chat-input button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .chat-input button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .chat-input button:active {
            transform: scale(0.98);
        }

        .status {
            text-align: center;
            padding: 8px;
            font-size: 0.75rem;
            color: #666;
            background: #f1f3f5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.green {
            background: #22c55e;
            box-shadow: 0 0 5px #22c55e;
        }

        .status-dot.red {
            background: #ef4444;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 95vh;
                border-radius: 20px;
            }

            .message-content {
                max-width: 85%;
                font-size: 0.9rem;
                padding: 10px 14px;
            }

            .chat-input button {
                padding: 12px 20px;
            }

            .chat-header h1 {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 450px) {
            .chat-input {
                padding: 12px;
                gap: 8px;
            }

            .chat-input input {
                padding: 12px 14px;
                font-size: 0.9rem;
            }

            .chat-input button {
                padding: 12px 16px;
                font-size: 0.9rem;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>
                <span>🤖</span> Smart AI Assistant
            </h1>
            <p>বাংলা ও ইংরেজিতে কথা বলুন | লোকাল নেটওয়ার্ক</p>
        </div>

        <div class="chat-messages" id="messages">
            <div class="message ai-message">
                <div class="message-content">
                    👋 হ্যালো! আমি আপনার AI বন্ধু। যেকোনো প্রশ্ন করতে পারেন!
                </div>
            </div>
        </div>

        <div class="chat-input">
            <input type="text" id="userInput" placeholder="এখানে লিখুন..." onkeypress="handleKeyPress(event)" autofocus>
            <button onclick="sendMessage()">📤 পাঠান</button>
        </div>

        <div class="status" id="status">
            <span class="status-dot green" id="statusDot"></span>
            <span id="statusText">সংযুক্ত | সার্ভার চলমান</span>
        </div>
    </div>

    <script>
        let userId = localStorage.getItem('userId');
        if (!userId) {
            userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
            localStorage.setItem('userId', userId);
        }

        let currentServerUrl = localStorage.getItem('serverUrl');

        function updateStatus(connected, message = null) {
            const dot = document.getElementById('statusDot');
            const textSpan = document.getElementById('statusText');

            if (connected) {
                dot.className = 'status-dot green';
                textSpan.innerHTML = message || '🟢 সংযুক্ত | সার্ভার চলমান';
            } else {
                dot.className = 'status-dot red';
                textSpan.innerHTML = message || '🔴 সংযোগ বিচ্ছিন্ন | সার্ভার চালু করুন';
            }
        }

        async function getServerUrl() {
            if (currentServerUrl) {
                return currentServerUrl;
            }

            const localIp = window.location.hostname;
            const possibleUrls = [
                `http://${localIp}:5000/chat`,
                'http://localhost:5000/chat'
            ];

            for (const url of possibleUrls) {
                try {
                    const testUrl = url.replace('/chat', '');
                    const response = await fetch(testUrl, { method: 'GET', mode: 'cors' });
                    if (response.ok) {
                        currentServerUrl = url;
                        localStorage.setItem('serverUrl', url);
                        updateStatus(true);
                        return url;
                    }
                } catch(e) {
                    continue;
                }
            }

            updateStatus(false);
            return null;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();

            if (!message) return;

            addMessage(message, 'user');
            input.value = '';
            updateStatus(true, '🟡 প্রক্রিয়াকরণ...');

            const SERVER_URL = await getServerUrl();

            if (!SERVER_URL) {
                addMessage('😞 সার্ভারে সংযোগ করতে পারছি না। নিশ্চিত করুন আপনার কম্পিউটারে `python ai_server.py` চালু আছে!', 'ai');
                updateStatus(false);
                return;
            }

            try {
                const response = await fetch(`${SERVER_URL}?message=${encodeURIComponent(message)}&user_id=${userId}`);
                const data = await response.json();
                addMessage(data.response, 'ai');
                updateStatus(true);
            } catch (error) {
                console.error('Error:', error);
                addMessage('😞 সার্ভারে সমস্যা হয়েছে। নিশ্চিত করুন সার্ভার চালু আছে!', 'ai');
                updateStatus(false);
                currentServerUrl = null;
                localStorage.removeItem('serverUrl');
            }
        }

        function addMessage(text, sender) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;

            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = text.replace(/\n/g, '<br>');

            messageDiv.appendChild(content);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        setInterval(async () => {
            const url = await getServerUrl();
            if (!url) {
                currentServerUrl = null;
                localStorage.removeItem('serverUrl');
            }
        }, 30000);
    </script>
</body>
</html>
