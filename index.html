<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI - আপনার বন্ধু</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            justify-content: flex-end;
        }

        .ai-message {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .user-message .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .ai-message .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
        }

        .chat-input {
            display: flex;
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input input:focus {
            border-color: #667eea;
        }

        .chat-input button {
            margin-left: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .chat-input button:hover {
            transform: scale(1.05);
        }

        .status {
            text-align: center;
            padding: 5px;
            font-size: 12px;
            color: #666;
            background: #f9f9f9;
        }

        @media (max-width: 768px) {
            .message-content {
                max-width: 85%;
            }

            .chat-input button {
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 Smart AI Assistant</h1>
            <p>বাংলা ও ইংরেজিতে কথা বলতে পারেন | ২৪/৭ অনলাইন</p>
        </div>

        <div class="chat-messages" id="messages">
            <div class="message ai-message">
                <div class="message-content">
                    👋 হ্যালো! আমি আপনার AI বন্ধু। যেকোনো প্রশ্ন করতে পারেন!
                </div>
            </div>
        </div>

        <div class="chat-input">
            <input type="text" id="userInput" placeholder="এখানে লিখুন..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">➤ পাঠান</button>
        </div>

        <div class="status" id="status">
            🟢 সংযুক্ত | সার্ভার চলমান
        </div>
    </div>

    <script>
        let userId = localStorage.getItem('userId');
        if (!userId) {
            userId = 'user_' + Date.now() + '_' + Math.random();
            localStorage.setItem('userId', userId);
        }

        // আপনার সার্ভারের ঠিকানা
        const SERVER_URL = 'http://192.168.0.103:5000/chat';

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();

            if (!message) return;

            // ইউজারের মেসেজ দেখান
            addMessage(message, 'user');
            input.value = '';

            // স্ট্যাটাস আপডেট
            document.getElementById('status').innerHTML = '🟡 প্রক্রিয়াকরণ...';

            try {
                // সার্ভারে পাঠান
                const response = await fetch(`${SERVER_URL}?message=${encodeURIComponent(message)}&user_id=${userId}`);
                const data = await response.json();

                // AI এর উত্তর দেখান
                addMessage(data.response, 'ai');
                document.getElementById('status').innerHTML = '🟢 সংযুক্ত | সার্ভার চলমান';

            } catch (error) {
                console.error('Error:', error);
                addMessage('😞 সার্ভারে সংযোগ করতে পারছি না। নিশ্চিত করুন আপনার কম্পিউটারে AI সার্ভার চালু আছে!', 'ai');
                document.getElementById('status').innerHTML = '🔴 সংযোগ বিচ্ছিন্ন | সার্ভার চালু করুন';
            }
        }

        function addMessage(text, sender) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;

            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = text;

            messageDiv.appendChild(content);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // ৩ সেকেন্ড পর সার্ভার চেক
        setInterval(async () => {
            try {
                const response = await fetch('http://localhost:5000/');
                if (response.ok) {
                    document.getElementById('status').innerHTML = '🟢 সংযুক্ত | সার্ভার চলমান';
                }
            } catch {
                document.getElementById('status').innerHTML = '🔴 সংযোগ বিচ্ছিন্ন | সার্ভার চালু করুন';
            }
        }, 10000);
    </script>
</body>
</html>
